input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Port 5000 is not an HTTP server: any connection that does not send valid JSON 
  # (e.g., a browser typing localhost:5000 by mistake) ends up here.
  # We drop these lines rather than polluting the index with raw HTTP headers.
  if "_jsonparsefailure" in [tags] {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microcrm-back-%{+YYYY.MM.dd}"
  }
}
