services:
  back:
    build:
      context: .
      target: back
    environment:
      - LOGSTASH_HOST=host.docker.internal
      - LOGSTASH_PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    restart: unless-stopped

  front:
    build:
      context: .
      target: front
    ports:
      - "80:8080"
    depends_on:
      back:
        condition: service_healthy
    restart: unless-stopped
