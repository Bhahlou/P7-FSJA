plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'jacoco'
	id 'org.sonarqube' version '7.3.1.8318'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Spring Boot's plugin also builds a "-plain.jar" (classes only, not runnable)
// alongside the real executable jar. We never consume the plain jar as a
// library, and its presence in back/build/libs/*.jar was getting picked up
// as a second, confusing release asset.
jar {
    enabled = false
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        // build.gradle lives in back/, mais le repo (et front/) sont un niveau au-dessus
        property "sonar.projectBaseDir", rootDir.parentFile
        property "sonar.organization", "bhahlou"
        property "sonar.projectKey", "Bhahlou_P7-FSJA"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.sources", "back/src/main,front/src"
        property "sonar.tests", "back/src/test,front/src"
        property "sonar.test.inclusions", "**/*Test*.java,front/src/**/*.spec.ts"
        property "sonar.exclusions", "front/src/**/*.png,front/src/**/*.jpg,front/src/**/*.jpeg,front/src/**/*.ico,front/src/**/*.gif,front/src/**/*.woff,front/src/**/*.woff2,front/src/**/*.ttf"
        property "sonar.javascript.lcov.reportPaths", "front/coverage/microcrm/lcov.info"
        // sonar.java.binaries / sonar.java.libraries (+ variantes test) et le rapport
        // Jacoco sont déduits automatiquement par le plugin à partir du build Gradle
    }
}