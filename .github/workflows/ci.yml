name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6

  back:
    name: Build & test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        working-directory: back
        run: ./gradlew test

      - name: Build
        working-directory: back
        run: ./gradlew build -x test

  front:
    name: Build & test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run tests
        working-directory: front
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Build production bundle
        working-directory: front
        run: npx ng build --optimization

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/microcrm/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [front]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/microcrm/

      - name: Build & analyze
        working-directory: back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar
