name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Skipped for Dependabot PRs: its auto-generated commit body (changelog
  # links, updated-dependencies trailer) routinely exceeds commitlint's
  # line-length rule and isn't something we can reformat from our end.
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6

  back:
    name: Build & test backend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        working-directory: back
        run: ./gradlew test

      - name: Build
        working-directory: back
        run: ./gradlew build -x test

  # Also runs on push to main (unlike commitlint/back) so sonar below always
  # has a fresh coverage report to analyze after a merge, not just during PRs.
  front:
    name: Build & test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run tests
        working-directory: front
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Build production bundle
        working-directory: front
        run: npx ng build --optimization

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/microcrm/lcov.info
          retention-days: 1

  # Runs on push to main too (not just pull_request) so SonarCloud's analysis
  # of main is refreshed after every merge, instead of staying pinned to
  # whatever commit last had an open PR analyzed against it.
  # Skipped for Dependabot PRs: GitHub withholds repository Actions secrets
  # (SONAR_TOKEN included) from workflow runs triggered by Dependabot, so
  # this job can't authenticate there. Sonar still re-analyzes main on the
  # next real push after the PR is merged.
  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [front]
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/microcrm/

      - name: Build & analyze
        working-directory: back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar
